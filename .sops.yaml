# --- ARCHITECTURE & MASTER KEY ---
# The Master Key is the singular "Key to the City." It is used exclusively by human
# administrators on trusted machines to edit secrets. It is NEVER placed on deployed
# hosts. The sops CLI tool looks for this Master Keypair via the SOPS_AGE_KEY
# environment variable, or falls back to ~/.config/sops/age/keys.txt.
#
# * The "sops" CLI tool performs these actions:
#     1. Decrypts (or creates) a target secrets file using the Master Keypair.
#     2. Opens the decrypted file in an editor.
#     3. On close, encrypts the file using EVERY pubkey listed in the
#        "key_groups" block below that matches the file's path_regex.
#
# * The sops.nix module (on deployed hosts) performs these actions:
#     1. Looks for its specific Host Keypair at the location specified by
#        sops.age.keyFile (e.g., /var/lib/sops-nix/host_keypair.age).
#     2. Looks for the secrets/xxxx_yyyy.yaml files, that were copied into
#        the nix store (/nix) during system evaluation and deployment.
#     3. Uses the Host Keypair to decrypt the yaml secrets files and
#        put the decrypted secrets into volatile root-readable /run/secrets.
#
# --- ADDING A NEW HOST ---
# To add a new keypair for a machine:
#     1. Generate the pure Age keypair:
#          age-keygen -o /tmp/host_keypair.age
#     2. Run `sops secrets/master_secrets.yaml` and add a new variable for
#        age_keypair_host_<hostname>, pasting the entire generated key file.
#     3. Extract the public key:
#          age-keygen -y /tmp/host_keypair.age
#     4. Add the public key alias to the "keys" dictionary below.
#     5. Add the alias to the appropriate key_groups in creation_rules below.
#     6. Add secrets as req, with `sops secrets/[hostname]_host_secrets.yaml`.
#     7. Rekey all secrets files, with `just rekey-secrets`.

# Local "keys" dictionary defines variables (aliases) for PUBLIC KEYS only.
# Note: this variable is "local," and not used by SOPS.
keys:
  - &age_pubkey_master age1cnryfel34a36zkaayv9a0enmaetwrp3jk2nt807af8y6v6nefejs9jp9vk
  - &age_pubkey_host_grig age1jymzkqqtju7qs7ssrhmzckhnvv3322tjv8hs0ngl7q5a9pc0eens9a5hqz
  - &age_pubkey_host_nas age1fu4fdj4g09tqj4gzfn3trvzdfcgfjaeeplxnvydm8swq4ju0ggyquqzp8s
  - &age_pubkey_host_romr age1llydkpnekmd0c06rg49ffvq3xe3edk605h3psy3cx7xj0rdq9p4sy6lm7t
  - &age_pubkey_host_tm1 age1x4fdtv0m97wy7d0fs00xq0ehrnjfrxe98er5lz7kz5jhjd76ksusyp53wn
  - &age_pubkey_host_tm2 age19srxwkl38zsm949hj2v9mdqmhqkuc8xlkqdw6ez6kp7ayttddq7strdvx9

# Each rule in this "creation_rules" list tells SOPS which public key(s) to
# use to encrypt a specific SOPS secrets file.
# Any host in the list with a matching privkey can decrypt the secrets file.
creation_rules:

  # Master Secrets

  - path_regex: secrets/master_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master

  # Security Zone Secrets

  - path_regex: secrets/vbc_farp_zone_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master
          - *age_pubkey_host_grig
          - *age_pubkey_host_romr
  - path_regex: secrets/vbc_zone_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master
          - *age_pubkey_host_grig
  - path_regex: secrets/lsa_zone_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master
          - *age_pubkey_host_nas
  - path_regex: secrets/farp_zone_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master
          - *age_pubkey_host_romr
  - path_regex: secrets/cop_zone_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master
          - *age_pubkey_host_tm1
          - *age_pubkey_host_tm2

  # Host Secrets

  - path_regex: secrets/grig_host_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master
          - *age_pubkey_host_grig
  - path_regex: secrets/romr_host_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master
          - *age_pubkey_host_romr
  - path_regex: secrets/tm1_host_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master
          - *age_pubkey_host_tm1
  - path_regex: secrets/tm2_host_secrets\.yaml$
    key_groups:
      - age:
          - *age_pubkey_master
          - *age_pubkey_host_tm2

